<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dapur Nona - Sistem Manajemen Supplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 1); }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Dapur Nona</h1>
                <p id="currentDate" class="text-gray-500 font-medium"></p>
            </div>
            <button id="resetBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full transition-all flex items-center gap-2 shadow-lg">
                <i class="fas fa-undo"></i> Reset Semua Data
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Total Omzet</p>
                <h2 id="statOmzet" class="text-2xl font-bold text-gray-800">Rp 0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-green-500">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Total Profit (20%)</p>
                <h2 id="statProfit" class="text-2xl font-bold text-green-600">Rp 0</h2>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-purple-500">
                <p class="text-sm text-gray-500 uppercase tracking-wider">Item Terjual</p>
                <h2 id="statSold" class="text-2xl font-bold text-gray-800">0 Unit</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-card p-6 rounded-2xl shadow-md">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-blue-500"></i> Tambah Titipan
                    </h3>
                    <div class="space-y-4">
                        <input type="text" id="supName" placeholder="Nama Supplier" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none">
                        <input type="number" id="supQty" placeholder="Jumlah Stok" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none">
                        <input type="number" id="supPrice" placeholder="Harga Jual per Unit" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-400 outline-none">
                        <button onclick="addTitipan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">Simpan Data</button>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-2xl shadow-md">
                    <canvas id="salesChart" height="250"></canvas>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="glass-card rounded-2xl shadow-md overflow-hidden">
                    <div class="p-6 border-b">
                        <h3 class="text-lg font-semibold">Daftar Stok & Penjualan Cepat</h3>
                    </div>
                    <div class="table-container">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-gray-600 text-sm">
                                <tr>
                                    <th class="p-4">Supplier</th>
                                    <th class="p-4 text-center">Sisa Stok</th>
                                    <th class="p-4">Harga</th>
                                    <th class="p-4">Aksi Jual</th>
                                    <th class="p-4">Hapus</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryList"></tbody>
                        </table>
                    </div>
                </div>

                <div class="glass-card rounded-2xl shadow-md overflow-hidden">
                    <div class="p-6 border-b bg-gray-50">
                        <h3 class="text-lg font-semibold text-gray-700">Riwayat Transaksi Terakhir</h3>
                    </div>
                    <div id="salesHistory" class="p-4 space-y-3 max-h-60 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 px-6 py-3 rounded-xl text-white font-medium shadow-2xl z-50"></div>

    <script>
        let inventory = [];
        let sales = [];
        let chart;

        const formatRp = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-xl text-white font-medium shadow-2xl z-50 transition-all duration-300 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function saveData() {
            localStorage.setItem('dn_inventory', JSON.stringify(inventory));
            localStorage.setItem('dn_sales', JSON.stringify(sales));
            render();
        }

        function loadData() {
            try {
                inventory = JSON.parse(localStorage.getItem('dn_inventory')) || [];
                sales = JSON.parse(localStorage.getItem('dn_sales')) || [];
            } catch (e) {
                console.error("Data korup, mereset...");
                inventory = []; sales = [];
            }
            render();
        }

        function addTitipan() {
            const name = document.getElementById('supName').value.trim();
            const qty = parseInt(document.getElementById('supQty').value);
            const price = parseInt(document.getElementById('supPrice').value);

            if (!name || isNaN(qty) || isNaN(price) || qty <= 0 || price <= 0) {
                return showToast('Harap isi data dengan valid!', 'error');
            }

            inventory.push({ id: Date.now(), name, qty, originalQty: qty, price });
            document.getElementById('supName').value = '';
            document.getElementById('supQty').value = '';
            document.getElementById('supPrice').value = '';
            showToast('Data titipan ditambahkan');
            saveData();
        }

        function recordSale(id) {
            const item = inventory.find(i => i.id === id);
            const qtyInput = document.getElementById(`qty-${id}`);
            const sellQty = parseInt(qtyInput.value);

            if (isNaN(sellQty) || sellQty <= 0) return showToast('Jumlah tidak valid', 'error');
            if (sellQty > item.qty) return showToast('Stok tidak cukup!', 'error');

            item.qty -= sellQty;
            const omzet = sellQty * item.price;
            const profit = omzet * 0.2;

            sales.unshift({
                name: item.name,
                qty: sellQty,
                omzet,
                profit,
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            });

            showToast(`${sellQty} unit ${item.name} terjual`);
            saveData();
        }

        function deleteItem(id) {
            if(confirm('Hapus item ini dari inventori?')) {
                inventory = inventory.filter(i => i.id !== id);
                saveData();
            }
        }

        function initChart() {
            const ctx = document.getElementById('salesChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Omzet Bersih', 'Profit Dapur Nona'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#3b82f6', '#10b981'],
                        borderWidth: 0
                    }]
                },
                options: { plugins: { legend: { position: 'bottom' } }, cutout: '70%' }
            });
        }

        function render() {
            // Stats
            const totalOmzet = sales.reduce((a, b) => a + b.omzet, 0);
            const totalProfit = sales.reduce((a, b) => a + b.profit, 0);
            const totalSold = sales.reduce((a, b) => a + b.qty, 0);

            document.getElementById('statOmzet').innerText = formatRp(totalOmzet);
            document.getElementById('statProfit').innerText = formatRp(totalProfit);
            document.getElementById('statSold').innerText = `${totalSold} Unit`;

            // Inventory Table
            const invList = document.getElementById('inventoryList');
            invList.innerHTML = inventory.map(item => `
                <tr class="border-b hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-medium text-gray-800">${item.name}</td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${item.qty < 5 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                            ${item.qty} / ${item.originalQty}
                        </span>
                    </td>
                    <td class="p-4 text-gray-600">${formatRp(item.price)}</td>
                    <td class="p-4">
                        <div class="flex items-center gap-2">
                            <input type="number" id="qty-${item.id}" value="1" min="1" class="w-16 p-1 border rounded text-center">
                            <button onclick="recordSale(${item.id})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg text-sm">Jual</button>
                        </div>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // History
            const historyList = document.getElementById('salesHistory');
            historyList.innerHTML = sales.length ? sales.map(s => `
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border shadow-sm">
                    <div>
                        <p class="font-bold text-gray-800">${s.name} <span class="text-gray-400 font-normal">(${s.qty} unit)</span></p>
                        <p class="text-xs text-gray-400">${s.time}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-semibold text-blue-600">+${formatRp(s.omzet)}</p>
                        <p class="text-[10px] text-green-500">Profit: ${formatRp(s.profit)}</p>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-gray-400 py-4">Belum ada transaksi hari ini</p>';

            // Update Chart
            if(chart) {
                chart.data.datasets[0].data = [totalOmzet - totalProfit, totalProfit];
                chart.update();
            }
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm('Hapus semua data hari ini secara permanen?')) {
                inventory = []; sales = [];
                saveData();
                showToast('Semua data telah dibersihkan');
            }
        });

        updateDate();
        initChart();
        loadData();
    </script>
</body>
</html>
